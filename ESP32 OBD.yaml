# TODO
# - calculator to measure charging efficiency
# - when charge starts, store battery energy.
# when either energy value updates, calculate current charge efficiency. (current battery charge - start battery charge) / charger energy
# 8.12.26 - added cushin factor for chgarger losses, offset reported battery state to charge 1% over actual charge to get complete charge at 100%
esphome:
  name: $device_internal_name
  friendly_name: $friendly_name
  comment: EPS32-S3 N16R8
  # https://github.com/shpegun60/ESP32-S3-N16R8/blob/85d3ecc973858c9ff781ffd413dd6f892be4114c/ESP32-S3-DevKitC-1-N16R8.json
  # platformio_options:
  #   board_build.arduino.memory_type: qio_opi
  #   board_build.flash_mode: qio
  build_flags: 
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_IDF_TARGET_ESP32S3

logger:
  level: DEBUG
  logs:
    ble_elm327: DEBUG
    ble_elm327.sensor: DEBUG

# Enable Home Assistant API
api:
  reboot_timeout: 0s

ota:
  platform: esphome

wifi:
  reboot_timeout: 0s
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  # ---------------------------------
  # ESP32S3N16R8 config 20250106 serial, RGBW LEDs and working PSRAM

substitutions:
  friendly_name: "car-obd"
  device_internal_name: car-obd
  logger_lvl: "DEBUG"

# web_server:

esp32:
  board: esp32-s3-devkitc1-n16r8
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  # partitions: "partitions_custom.csv" # partition works
  framework:
    type: esp-idf
    version: recommended
# https://community.home-assistant.io/t/ i-cant-get-the-psram-of-an-esp32-s3-n16r8-to-work/948815/8
    sdkconfig_options:
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"


psram:
  mode: octal
  speed: 80MHz

# https://github.com/eigger/espcomponents/tree/master/components/ble_elm327
# ------------------------------------------------
# esp32_ble_tracker:
#   scan_parameters:
#     active: true

# text_sensor:
#   - platform: ble_scanner
#     name: "BLE Devices Scanner" 
# https://esphome.io/components/http_request.html
http_request:

external_components:
  - source: github://eigger/espcomponents@latest
    components: [ ble_elm327 ]
    refresh: always

ble_client:
  - mac_address: "66:1E:87:00:B3:4F"
    id: obd_client
    # auto_connect: false
    on_connect:
      then:
        # - lambda: |-
        #     ESP_LOGD("ble_client_lambda", "Connected to BLE device");
        - binary_sensor.template.publish:
            id: car_present
            state: ON
    on_disconnect:
      then:
        # - lambda: |-
        #     ESP_LOGD("ble_client_lambda", "Connected to BLE device");
        - binary_sensor.template.publish:
            id: car_present
            state: OFF

# http://forum.gps-laptimer.de/viewtopic.php?p=25972#p25972
# error codes - https://www.programmersought.com/article/5475147562/
ble_elm327:
  id: elm
  ble_client_id: obd_client
  # uuid values are unique to VEEPEAK OBD-II Scan Tool
  service_uuid: "FFF0"
  rx_char_uuid: "FFF1"
  tx_char_uuid: "FFF2"
  init_commands:
    - "ATAL"
    # - "ATSP6"
    # - "ATS0"
    # - "ATM0"
    # - "ATAT1"
  tx_delay: 50

globals:
  - id: start_energy
    type: float
    initial_value: '0.0'
    
switch:
  - platform: ble_client
    ble_client_id: obd_client
    name: "Enable OBDII"
        
  - platform: template
    name: "Enable EVSE API"
    id: evse_api
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# one hex character = 4 bits
# https://www.home-assistant.io/integrations/sensor/#device-class
# PID codes - https://obdb.community/#/vehicles/Hyundai/IONIQ-5
# to calculate byte index, divide first bit position by 8, this is the byte index.

#            0  1  2
# 0:62 01 01 EF FB E7

#   3  4  5  6  7  8  9
# 1:EF 9A 20 40 01 72 00

#   10 11 12 13 14 15 16
# 2:FF F3 1D BB 1E 1D 1D

#   17 18 19 20 21 22 23
# 3:1E 1D 1D 1D 00 46 C6

#   24 25 26 27 28 29 30
# 4:BC C6 9C 00 00 7E 00

#   31 32 33 34 35 36 37
# 5:02 88 E6 00 02 84 CD

# 6:00 01 E1 C3 00 01 D6
# 7:E6 03 75 D0 8D 00 02
# 8:F7 00 00 00 00 06 68
# https://www.home-assistant.io/integrations/binary_sensor/#device-class
number:
  # - platform: template
  #   name: "Efficiency"
  #   id: efficiency
  #   # web_server:
  #   #   sorting_group_id: sorting_group_control_settings
  #   #   sorting_weight: 40
  #   optimistic: true
  #   restore_value: True
  #   # device_class: battery_charging
  #   unit_of_measurement: "mi/kWh"
  #   min_value: 3.0
  #   initial_value: 3.1
  #   max_value: 5.0
  #   step: 0.1
  #   on_value:
  #     - component.update: range

  - platform: template
    name: "Target Charge"
    id: target_charge
    # web_server:
    #   sorting_group_id: sorting_group_control_settings
    #   sorting_weight: 40
    optimistic: true
    restore_value: true
    # device_class: battery_charging
    unit_of_measurement: "%"
    min_value: 20
    initial_value: 80
    max_value: 100
    step: 1.0
    on_value:
      # - script.execute: set_target
      - script.execute: ev_set_charge_limit
      - script.execute: set_charge_current

datetime:
  # - platform: template
  #   id: datetime_target
  #   type: time
  #   name: Time to Target
  #   restore_value: True
  #   optimistic: yes

  - platform: template
    id: datetime_ready
    type: time
    name: Ready Time
    restore_value: true
    optimistic: yes
    on_value:
      then:
      - script.execute: set_charge_current

binary_sensor:
  - platform: template
    name: "HV Battery"
    id: hv_battery
    lambda: |-
      return id(hv_battery_charging).state > 0.0f;
    device_class: battery_charging
    on_state:
      then:
      - component.update: charger_current
      - component.update: charger_voltage
    on_press:
      then:
        - globals.set:
            id: start_energy
            value: !lambda |-
              return id(remaining_energy).state;
    on_release:
      then:
        - sensor.integration.reset:  charger_energy

  - platform: template
    name: "Charging Socket"
    lambda: |-
      return id(charging_socket_connected).state == 1.0f || id(charging_socket_connected).state == 5.0f || id(charging_socket_connected).state == 2.0f || id(charging_socket_connected).state == 36.0f;
    device_class: connectivity

  - platform: template
    name: "Car Present"
    id: car_present
    # lambda: |-
    #   return id(hv_battery_charging).state > 0.0f;
    device_class: presence

  - platform: template
    name: "EVSE Override"
    id: evse_override
# 42.46kwh	57.63	15.17
# 60%		80%	20%
# 10:20		1:28	15:08
# 			1.0kW		1.32kW	71.6%

# 21.68		57.66	35.98
# 10:38		4:12	5:34
# 			6.46kW		7.5kW	86.1%

# 9:53      6:43    8:50
# 31.21     65.54   34.33
#           4.25kW  3.886kW  91.4%

# 10:22     6:42    8:20
# 22.48     57.60   35.12
#           4.73kW  4.21kW   89.0%

# 8:41      12:36   15.92
# 14.36     52.47   38.11
#                   2.39 kW
#                   2.8 kw   85.4%

# estimate at beginning was 14 hours
# actual time was 11.5 hours
# 21.5% faster than estimate
# even though reported levels are showing 85% efficiency, charge time estimate is consistently longer than actual
# 11:13     10:43    11.5
# 11.69     57.66   45.97
#                   4.00kW  4.7kW   85.0%
time:
  - platform: sntp
    id: my_time
    timezone: EST+5EDT,M3.2.0/2,M11.1.0/2
    on_time:
      - seconds: 0
        minutes: '*'
        then:
        # - script.execute: set_target
        - script.execute: set_charge_current
          
script:
  - id: set_charge_current
    then:
      - sensor.template.publish:
          id: target_charge_current
          state: !lambda |-
              float full_capacity_energy, remaining_energy_float, target_charge_float, current_charge_float, time_now_float, time_ready_float, time_to_ready_float, needed_energy_float, charger_voltage_float, charger_current_float;
              full_capacity_energy = 73.7f;
              
              target_charge_float = id(target_charge).state;
              current_charge_float = (id(hv_SOC).state - 0.5f);
              
              remaining_energy_float = id(remaining_energy).state;

              needed_energy_float = (full_capacity_energy * ( target_charge_float / 100.0f )) - remaining_energy_float;
              // ESP_LOGI("main", "needed_energy_float: %02f", needed_energy_float);
              // in hours
              time_now_float = id(my_time).now().hour + (id(my_time).now().minute / 60.0f);
              time_ready_float = id(datetime_ready).hour + (id(datetime_ready).minute / 60.0f);
              
              // if ready time is today
              if( time_ready_float > time_now_float ){
                time_to_ready_float = time_ready_float - time_now_float;
              }
              else { // it's tomorrow 13:00 , ready time is 8:00, 8 + (24-13) = 
                time_to_ready_float = time_ready_float + (24 - time_now_float);
              }
              // ESP_LOGI("main", "time_to_ready_float: %02f", time_to_ready_float);

              // energy = volts * amps * hours
              // energy / volts * hours = amps
              if ( id(charger_voltage).state < 200.0f || isnan(id(charger_voltage).state) )
                charger_voltage_float = 240.0f;
              else
                charger_voltage_float = id(charger_voltage).state * 1.0f;
                
              // ESP_LOGI("main", "charger_voltage_float: %02f", charger_voltage_float);

              // ESP_LOGI("main", "target_charge_current: %02f", needed_energy_float / ( charger_voltage_float * time_to_ready_float));
              // 0.88 derating for charger losses causing current spike at end of charge
              if( current_charge_float < target_charge_float ) {
                charger_current_float = 1000.0f * (needed_energy_float / (charger_voltage_float * time_to_ready_float * 0.88)) + 0.5f; // 0.5 to account for difference between pilot and actual current.
                return min(charger_current_float, 32.0f);
                }
              else
                return 0.0f;
      - script.execute: ev_set_state
      - script.execute: ev_set_charge_current
      # - script.execute:
      #       id:  openevse_get
      #       endpoint: 'status'
      #       key: 'max_current'

  - id: ev_send_batt
    then:
    - if:
        condition:
          - switch.is_on: evse_api
        then:
          - http_request.post:
              url: http://10.0.1.229/status
              json:
                battery_level: !lambda |-
                  // charge 1% past target
                  int N = id(hv_SOC).state - 0.5f;
                  char str[12];
                  return itoa(N, str, 10) ;
                # battery_range: '0'
                # time_to_full_charge: '0'

      # - script.execute:
      #     id: openevse_get
      #     openevse_ip: ${openevse_ip}
      #     endpoint: 'status'
      #     # key: 'manual_override'


  - id: openevse_get
    parameters:
      openevse_ip: string
      endpoint: string
      # key: string
    then:
# https://community.home-assistant.io/t/http-request-get-does-not-work-need-one-variable-from-webpage/952854/11
    - http_request.get:
        url: !lambda |-
          // ESP_LOGD("http_parse", std::string("http://" + openevse_ip + "/" + endpoint).c_str());
          // return std::string("http://" + openevse_ip + "/" + endpoint).c_str(); // "http://" + openevse_ip + "/" + endpoint;
          return "http://" + openevse_ip + "/" + endpoint.c_str();
        capture_response: true
        max_response_buffer_size: 8000
        request_headers:
          Content-Type: application/json
        on_response:
          then:
            # - if:
            #     condition:
            #         lambda: return response->status_code == 200;
            #     then:
                   - lambda: |-
                       json::parse_json(body, [](JsonObject root)  {
                       if(root["manual_override"] == 1) {
                         id(evse_override).publish_state(true);
                         ESP_LOGI("main","override is on");
                       }
                        else {
                         id(evse_override).publish_state(false);
                         ESP_LOGI("main","override is off");
                        }
                        
                       // float value = atof(counterstring) * 1.0f ;
                       // id(return_data_2).publish_state(value);
                       return true;
                       });
            
          
# url: http://10.0.1.81/limit
  # type: 'soc'
  # auto_release: 'true'
  - id: ev_set_charge_limit
    then:
    - if:
        condition:
          - switch.is_on: evse_api
        then:
          - http_request.post:
              url: http://10.0.1.229/config
              json:
                limit_default_value: !lambda |-
                  int N = id(target_charge).state;
                  char str[12];
                  return itoa(N, str, 10) ;
                limit_default_type: 'soc'

  - id: ev_set_state
    then:
    - if:
        condition:
          - switch.is_on: evse_api
        then:
          - if:
              condition: 
                - lambda: |-
                    float target_charge_current_float = id(target_charge_current).state;
                    int target_charge_current_int = ceil(target_charge_current_float);
                    int safe_current_int;
                    return target_charge_current_int < 6;
              then:
                if:
                  condition:
                  - binary_sensor.is_off: evse_override
                  then:
                  - http_request.post:
                      url: http://10.0.1.229/override
                      json:
                        state: 'disabled'
                      capture_response: true
                      on_response:
                        then:
                          - if:
                              condition:
                                  lambda: return response->status_code == 201;
                              then:
                                  - binary_sensor.template.publish:
                                      id: evse_override
                                      state: ON
              else:
                if:
                  condition:
                  - binary_sensor.is_on: evse_override
                  then:
                  - http_request.send:
                      method: DELETE
                      url: http://10.0.1.229/override
                      capture_response: true
                      on_response:
                        then:
                          - if:
                              condition:
                                  lambda: return response->status_code == 200;
                              then:
                                  - binary_sensor.template.publish:
                                      id: evse_override
                                      state: OFF

  - id: ev_set_charge_current
    then:
    - if:
        condition:
          - switch.is_on: evse_api
        then:
          - http_request.post:
              url: http://10.0.1.229/config
              json:
                max_current_soft: !lambda |-
                  float target_charge_current_float = id(target_charge_current).state;
                  int target_charge_current_int = ceil(target_charge_current_float);
                  int safe_current_int;
                  
                  if( target_charge_current_int < 6)
                    safe_current_int = 6;
                  else if( target_charge_current_int > 32 )
                    safe_current_int = 32;
                  else
                    safe_current_int = target_charge_current_int;
                  
                  char str[12];
                  return itoa(safe_current_int, str, 10);
    
sensor:
  - platform: integration
    name: 'Charger Energy'
    id: charger_energy
    sensor: charger_power
    time_unit: h
    restore: true
    state_class: total_increasing
    device_class: energy
    filters:
    - round: 2
    
  - platform: template
    name: "Target Charge Current"
    id: target_charge_current
    device_class: current
    unit_of_measurement: A
    filters:
    - round: 2

  # 0:62B002D00000
  # 1:00FF9B00000000
  # 2:7A95AAAAAAAAAA #7A95 is mileage
  - platform: ble_elm327
    name: "Odometer"
    pid: "B002"
    mode: "22"
    pre_commands:
      - "ATSH 7C6"
    update_interval: 60s
    formula: "return (x[9] * 0x10000 + x[10] * 0x100 + x[11]);"
    device_class: distance
    unit_of_measurement: mi
    accuracy_decimals: 0

    # when charging [9] = 0111 0010
  - platform: ble_elm327
    # name: "HV Battery Charging - raw"
    id: hv_battery_charging
    pid: "0101"
    mode: "22"
    pre_commands:
      - "ATSH 7E4"
    update_interval: 60s
    formula: "return x[8];" # BIT POSITION 72

    # 5 - connected (stays at 5 when not charging)    0101
    # 4 - not connected or charging                   0100
    # 0 - not connected, not charging                 0000
  - platform: ble_elm327
    # name: "Charging Socket Connected - raw"
    id: charging_socket_connected
    pid: "E004"
    mode: "22"
    pre_commands:
      - "ATSH 744"
    update_interval: 60s
    formula: "return x[4];" # & 0x01;" # BIT POSITION 38, 1's place
    
    # new capacity is 77.4kWh
    # this may be calculated from 70kWh
    # https://www.reddit.com/r/Ioniq5/comments/1uy5k56/comment/oxwil5x/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button
  - platform: ble_elm327
    name: "Remaining Energy"
    id: remaining_energy
    pid: "0105"
    mode: "22"
    pre_commands:
      - "ATSH 7E4"
    update_interval: 60s
    formula: "return (x[28] * 256.0f + x[29]) * 2.0f / 1000.0f;"
    device_class: energy
    unit_of_measurement: kWh
    accuracy_decimals: 2
    filters:
      - clamp:
          max_value: 77.4
          min_value: 2.0
          ignore_out_of_range: true
    on_value:
      # - script.execute: set_target
      - script.execute: set_charge_current
      # - component.update: range
      
  - platform: ble_elm327
    name: "HV Battery State of Charge"
    id: hv_SOC
    pid: "0105"
    mode: "22"
    pre_commands:
      - "ATSH 7E4"
    update_interval: 60s
    # formula: "return x[4] / 2.0f;"
    formula: "return x[31] / 2.0f;"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      - clamp:
          min_value: 1.0
          ignore_out_of_range: true
    on_value:
      - script.execute: ev_send_batt

  - platform: ble_elm327
    name: "dashboard - HV SOC"
    pid: "0101"
    mode: "22"
    pre_commands:
      - "ATSH 7E4"
    update_interval: 60s
    formula: "return x[4] / 2.0f;"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      - clamp:
          min_value: 1.0
          max_value: 105.0
          ignore_out_of_range: true
      
  - platform: ble_elm327
    name: "VCMS - HV SOC"
    pid: "E003"
    mode: "22"
    pre_commands:
      - "ATSH 744"
    update_interval: 60s
    formula: "return x[15] / 2.0f;"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      - clamp:
          min_value: 1.0
          max_value: 105.0
          ignore_out_of_range: true


  - platform: ble_elm327
    # name: "Charger Voltage - raw"
    id: "charger_voltage_raw"
    pid: "E002"
    mode: "22"
    pre_commands: 
      - "ATSH 7E5"
    update_interval: 60s
    formula: "return (e * 256.0f + f) / 10.0f;"
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    on_value:
      then:
      - component.update: charger_voltage

  - platform: ble_elm327
    # name: "Charger Current - raw"
    id: "charger_current_raw"
    pid: "E002"
    mode: "22"
    pre_commands:
      - "ATSH 7E5"
    update_interval: 60s
    formula: "return (x[11] * 256.0f + x[12]) / 100.0f;"
    device_class: current
    unit_of_measurement: A
    accuracy_decimals: 2
    filters:
      - clamp:
          max_value: 48
          ignore_out_of_range: true
    on_value:
      then:
      - component.update: charger_current

  - platform: template
    name: "Charger Voltage"
    id: "charger_voltage"
    lambda: |-
      if( id(hv_battery) )
        return id(charger_voltage_raw).state;
      else
        return 0.0f;
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    on_value:
      - component.update: charger_power

  # - platform: template
  #   name: "Vehicle Range"
  #   id: range
  #   # subtract 10% range for nice coushin
  #   lambda: |-
  #     return (id(remaining_energy).state - 7) * id(efficiency).state;
  #   device_class: distance
  #   unit_of_measurement: mi
  #   accuracy_decimals: 0

  - platform: template
    name: "Charger Current"
    id: "charger_current"
    lambda: |-
      if( id(hv_battery) )
        return id(charger_current_raw).state;
      else
        return 0.0f;
    device_class: current
    unit_of_measurement: A
    accuracy_decimals: 2
    on_value:
      - component.update: charger_power
    
  - platform: template
    name: "Charger Power"
    id: charger_power
    lambda: |-
      return ( id(charger_voltage).state * id(charger_current).state ) / 1000.0f;
    device_class: power
    unit_of_measurement: kW
    accuracy_decimals: 2
    # on_value:
    #   - script.execute: set_target

  - platform: ble_elm327
    name: "12V Battery State of Charge"
    pid: "E011"
    mode: "22"
    pre_commands:
      - "ATSH 7E5"
    update_interval: 60s
    formula: "return x[20];"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - clamp:
          min_value: 2.0
          max_value: 110
          ignore_out_of_range: true

  - platform: ble_elm327
    name: "12V Battery Voltage"
    pid: "E001"
    mode: "22"
    pre_commands:
      - "ATSH 744"
    update_interval: 60s
    formula: "return (x[11] * 256.0f + x[12]) / 100.0f;"
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    filters:
      - clamp:
          max_value: 20.0
          ignore_out_of_range: true

  - platform: ble_elm327
    name: "12V Battery Current"
    pid: "E011"
    mode: "22"
    pre_commands:
      - "ATSH 7E5"
    update_interval: 60s
    formula: "return ((x[18] * 256.0f + x[19]) / 100.0f ) - 327.0f;" # + -327 
    device_class: current
    unit_of_measurement: A
    accuracy_decimals: 2
    filters:
      - clamp:
          max_value: 120.0
          min_value: -120.0
          ignore_out_of_range: true
          
